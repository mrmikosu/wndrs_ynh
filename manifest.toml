#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "wndrs"
name = "WNDRS KLLKTV"
description.en = "WNDRS collective site: public landing, member OS, and visitor analytics"
description.de = "WNDRS-Kollektiv-Website: Landing, Mitglieder-OS und Besucheranalyse"
description.fr = "Site du collectif WNDRS : landing, OS membres et analyse de fréquentation"

version = "0.1.13~ynh1"

maintainers = ["mrmikosu"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://wndrs.de"
code = "https://github.com/mrmikosu/wndrser"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = false
sso = false
disk = "250M"
ram.build = "300M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/site"

    [install.dashboard_domain]
    ask.en = "Domain for the Python analytics dashboard (HTTPS)"
    ask.de = "Domain für das Python-Besucher-Dashboard (HTTPS)"
    ask.fr = "Domaine du tableau de bord Python (HTTPS)"
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin_email]
    ask.en = "Email for the initial PHP OS admin"
    ask.de = "E-Mail für den ersten PHP-OS-Admin"
    ask.fr = "E-mail de l'admin PHP initial"
    type = "email"

    [install.password]
    type = "password"
    help.en = "Password for the PHP OS admin (and used to seed the dashboard admin if needed)."
    help.de = "Passwort für den PHP-OS-Admin (ggf. auch Dashboard-Seed)."

    [install.dashboard_admin]
    ask.en = "Username for the Python dashboard admin"
    ask.de = "Benutzername für das Python-Dashboard"
    ask.fr = "Nom d'utilisateur du dashboard Python"
    type = "string"
    default = "admin"

[resources]
    [resources.sources.main]
    # Keep in sync with GitHub release mrmikosu/wndrs_ynh@ynh-0.1.13
    # Local ZIP installs still ship sources/app.tar.gz; install prefers that file.
    url = "https://github.com/mrmikosu/wndrs_ynh/releases/download/ynh-0.1.13/wndrs-app-sources.tar.gz"
    sha256 = "af97862b6c79d2a8d76b7e800b0e15ac01ca7dbc7b3ce421834941deb37681a1"
    format = "tar.gz"
    in_subdir = false

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    # Dashboard vhost is bound in install script to dashboard_domain
    dashboard.auth_header = false
    dashboard.show_tile = false
    # Must stay false so admins can grant "visitors" (no Yunohost SSO in front of Python login)
    dashboard.protected = false
    dashboard.allowed = "visitors"

    [resources.ports]
    main.default = 8099

    [resources.apt]
    # Versioned PHP packages so apt actually installs phpX.Y-fpm (systemd unit).
    # Unversioned php-fpm can leave $php_version=8.2 while the unit is missing.
    packages = [
        "php8.2-fpm",
        "php8.2-cli",
        "php8.2-sqlite3",
        "php8.2-mbstring",
        "php8.2-curl",
        "php8.2-xml",
        "php8.2-gd",
        "php8.2-zip",
        "python3",
        "python3-venv",
        "python3-pip",
        "sqlite3",
    ]
