# Dedicated vhost fragment for the Python dashboard domain.
# Installed as /etc/nginx/conf.d/__DASHBOARD_DOMAIN__.d/__APP__-dashboard.conf
# ^~ wins over weaker prefix locations so we don't fall through to the
# Debian "Welcome to nginx" default root.

location ^~ / {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
