#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

# Public landing (Vite static under install_dir/www/).
# Do NOT use try_files with alias — nginx then looks up /site/assets/... on disk and 404s.
location __PATH__/ {
    alias __INSTALL_DIR__/www/;
    index index.html;
}

# Static assets under the landing prefix (explicit, wins over regex noise)
location ~* ^__PATH__/(assets|images|fonts)/(.*)$ {
    alias __INSTALL_DIR__/www/$1/$2;
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

# PHP OS (flattened) + collector under /os/a/
location __PATH__/os/ {
    alias __INSTALL_DIR__/www/os/;
    index index.php;
}

# Block data and config
location ~ ^__PATH__/os/(data|config\.php)(/|$) {
    deny all;
    return 404;
}

# PHP scripts under /os/
location ~ ^__PATH__/os/(.+\.php)$ {
    alias __INSTALL_DIR__/www/os/$1;
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTPS on if_not_empty;
}

# OS static files (assets, collector JS, uploads)
location ~* ^__PATH__/os/(assets|a|uploads)/(.*)$ {
    alias __INSTALL_DIR__/www/os/$1/$2;
    expires 7d;
    add_header Cache-Control "public";
}

# Front controller for non-file routes under /os/
location ~ ^__PATH__/os/(?!assets/|a/|uploads/).*$ {
    rewrite ^__PATH__/os/(.*)$ __PATH__/os/index.php?r=/$1 last;
}
